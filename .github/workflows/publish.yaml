name: Publish Release Asset

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: Zip integration and attach to release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Create zip file for the integration
        shell: bash
        run: |
          cd "${{ github.workspace }}/custom_components/harvia_sauna"
          zip harvia_sauna.zip -r ./

      - name: Upload the zip as a release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/custom_components/harvia_sauna/harvia_sauna.zip
          tag_name: ${{ github.event.release.tag_name }}
